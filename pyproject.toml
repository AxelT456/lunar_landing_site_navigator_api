[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-landing-site-navigator-api"
version = "1.0.0"
description = "Lunar Landing Site Navigator Backend API"
readme = "lunar-landing-api-contract.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "psycopg[binary,pool]>=3.2",
    "numpy>=2.0",
    "rasterio>=1.4",
    "pyproj>=3.7",
    "skyfield>=1.49",
    "jplephem>=2.22",
    "shapely>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
