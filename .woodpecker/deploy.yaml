# Deploy to the desktop server (see docs/DEPLOY.md). Single environment:
#   push to main              -> production (public Cloudflare URL, handoff repo docs/07)
#   deployment to production  -> redeploy that pipeline's commit (rollback)
when:
  - event: push
    branch: main
  - event: deployment
    environment: production

# The contract gate is the blocking `contract` step of ci.yaml: if it fails,
# this workflow does not run.
depends_on:
  - ci

steps:
  # The key can only run /srv/spaceapps/services/deploy/deploy-backend.sh on the
  # host (forced command), which accepts "production <sha>" and only deploys
  # commits already merged into main, with health check and rollback.
  - name: deploy
    image: alpine:3.20
    secrets: [deploy_ssh_key]
    commands:
      - apk add --no-cache --quiet openssh-client
      - mkdir -p ~/.ssh && chmod 700 ~/.ssh
      - printf '%s\n' "$${DEPLOY_SSH_KEY}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
      - echo '[172.21.0.1]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIORleI+T8QufN65wXHtr/PKhFbhGqfYgWqUffjWiBdEo' > ~/.ssh/known_hosts
      - ssh -p 2222 -o StrictHostKeyChecking=yes -o BatchMode=yes hackaton@172.21.0.1 "production ${CI_COMMIT_SHA}"

  - name: smoke
    image: alpine:3.20
    commands:
      - apk add --no-cache --quiet curl
      - BASE=http://spaceapps-api-prod:8000/api/v1 sh scripts/smoke.sh

  # The public URL is a Cloudflare Quick Tunnel that changes on restart, so it
  # comes from the `public_api_base` secret (single source of truth: handoff
  # repo docs/07) and a stale URL only warns: the deploy and the internal smoke
  # tests above already passed.
  - name: public-health
    image: alpine:3.20
    secrets: [public_api_base]
    commands:
      - apk add --no-cache --quiet curl
      - if curl -fsS --max-time 30 "$${PUBLIC_API_BASE}/health" >/dev/null; then echo "PASS  public health"; else echo "WARN  public health failed for $${PUBLIC_API_BASE}; check the tunnel URL in docs/07 and the public_api_base secret"; fi
