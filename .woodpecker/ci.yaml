# CI: runs on every PR and on main. Status check name: ci/woodpecker/<pr|push>/ci
when:
  - event: pull_request
  - event: push
    branch: main
  # deploy.yaml depends on this workflow, so it must also run on promotions.
  - event: deployment

# Throwaway PostGIS loaded with db/init (the same seed developers use), so the
# contract gate runs the real queries. The password only exists inside this pipeline.
services:
  - name: ci-postgis
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: spaceapps
      POSTGRES_USER: spaceapps
      POSTGRES_PASSWORD: ci

steps:
  - name: test
    image: python:3.12-slim
    commands:
      - python -m venv .venv
      - .venv/bin/pip install --quiet -r requirements.txt
      - .venv/bin/python -m pytest -q

  - name: seed-db
    image: postgis/postgis:16-3.4
    environment:
      PGPASSWORD: ci
    commands:
      - for i in $(seq 1 60); do pg_isready -q -h ci-postgis -U spaceapps && break; sleep 1; done
      - psql -v ON_ERROR_STOP=1 -q -h ci-postgis -U spaceapps -d spaceapps -f db/init/00_extensions.sql
      - gzip -dc db/init/10_seed.sql.gz | psql -v ON_ERROR_STOP=1 -q -h ci-postgis -U spaceapps -d spaceapps
      - psql -h ci-postgis -U spaceapps -d spaceapps -Atc "select count(*) from landing_sites"

  # Contract v1.1 gate (P-001 ErrorResponse, P-003 lat [-90, 90], sites from the DB).
  # Blocking: deploy.yaml depends on this workflow, so neither staging nor
  # production ship if it fails.
  - name: contract
    image: python:3.12-slim
    environment:
      DATABASE_URL: postgresql://spaceapps:ci@ci-postgis:5432/spaceapps
    commands:
      - .venv/bin/python scripts/contract_check.py

  - name: build
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: spaceapps-backend-official
      dockerfile: Dockerfile
      dry_run: true
