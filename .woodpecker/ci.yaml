# CI: runs on every PR and on main. Status check name: ci/woodpecker/<pr|push>/ci
when:
  - event: pull_request
  - event: push
    branch: main
  # deploy.yaml depends on this workflow, so it must also run on promotions.
  - event: deployment

steps:
  - name: test
    image: python:3.12-slim
    commands:
      - python -m venv .venv
      - .venv/bin/pip install --quiet -r requirements.txt
      - .venv/bin/python -m pytest -q

  # Contract v1.1 gate (P-001 ErrorResponse, P-003 lat [-90, 90]). Reported here
  # but not blocking; deploy.yaml makes it blocking for production.
  - name: contract
    image: python:3.12-slim
    failure: ignore
    commands:
      - .venv/bin/python scripts/contract_check.py

  - name: build
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: spaceapps-backend-official
      dockerfile: Dockerfile
      dry_run: true
